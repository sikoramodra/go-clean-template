x-db-environment: &x-db-environment
  POSTGRES_SSL_MODE: "disable"
  POSTGRES_HOST: "db"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "db"
  POSTGRES_PASSWORD: "myAwEsOm3pa55w0rd"
  POSTGRES_USER: "user"

x-st-db-environment: &x-st-db-environment
  POSTGRES_SSL_MODE: "disable"
  POSTGRES_HOST: "st_db"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "supertokens"
  POSTGRES_PASSWORD: "myAwEsOm3pa55w0rd"
  POSTGRES_USER: "user"

x-supertokens-environment: &x-supertokens-environment
  API_KEYS: "my5up3rPrIvat3ApiK3y"
  POSTGRES_HOST: "st_db"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "user"
  POSTGRES_PASSWORD: "myAwEsOm3pa55w0rd"
  POSTGRES_DB: "supertokens"

x-backend-app-environment: &x-backend-app-environment
  GOMAXPROCS: "1"
  # App
  APP_NAME: "go-clean-template"
  APP_VERSION: "1.0.0"
  # HTTP settings
  HTTP_PORT: "8080"
  HTTP_USE_PREFORK_MODE: "false"
  # Logger
  LOG_LEVEL: "debug"
  # PG
  PG_POOL_MAX: "2"
  PG_URL: "postgres://user:myAwEsOm3pa55w0rd@db:5432/db"
  # Metrics
  METRICS_ENABLED: "true"
  # Swagger
  SWAGGER_ENABLED: "true"
  # Tracing
  TRACING_ENABLED: "true"
  TRACING_OTLP_ENDPOINT: "jaeger:4317"
  TRACING_OTLP_INSECURE: "true"
  TRACING_SAMPLE_RATE: "1.0" # DON'T set to 1.0 in production, use a lower value like 0.1 or 0.01
  # SuperTokens
  SUPERTOKENS_API_DOMAIN: "https://app.lvh.me"
  SUPERTOKENS_API_KEY: "my5up3rPrIvat3ApiK3y"
  SUPERTOKENS_APP_NAME: "go-clean-template"
  SUPERTOKENS_CONNECTION_URI: "http://supertokens:3567"
  SUPERTOKENS_WEBSITE_DOMAIN: "http://localhost:5173"

services:
  db:
    container_name: db
    image: postgres:18.4-alpine
    environment:
      !!merge <<: *x-db-environment
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      app_network:
        aliases:
          - db.lvh.me

  st_db:
    container_name: st_db
    image: postgres:18.4-alpine
    environment:
      !!merge <<: *x-st-db-environment
    volumes:
      - st_db_data:/var/lib/postgresql
    ports:
      - "5433:5432"
    networks:
      app_network:
        aliases:
          - st_db.lvh.me

  supertokens:
    container_name: supertokens
    image: supertokens/supertokens-postgresql:11.4
    environment:
      !!merge <<: *x-supertokens-environment
    ports:
      - "3567:3567"
    depends_on:
      - st_db
    networks:
      app_network:
        aliases:
          - supertokens.lvh.me

  jaeger:
    container_name: jaeger
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "6831:6831/udp" # Jaeger agent UDP
    networks:
      app_network:
        aliases:
          - jaeger.lvh.me

  app:
    container_name: app
    platform: linux/amd64
    pid: "host"
    build:
      context: .
    environment:
      !!merge <<: *x-backend-app-environment
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - db
      - supertokens
      - jaeger
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: '2Gb'
        reservations:
          cpus: '0.60'
          memory: '1Gb'
    networks:
      app_network:
        aliases:
          - app.lvh.me

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.14.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
    networks:
      app_network:
        aliases:
          - prometheus.lvh.me

  nginx:
    container_name: nginx
    image: nginx:1.31.3-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    networks:
      app_network:
        aliases:
          - nginx.lvh.me

networks:
  app_network:
    external: false

volumes:
  db_data:
  st_db_data:
  prometheus_data:
